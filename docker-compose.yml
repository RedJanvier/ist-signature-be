services:
  postgres:
    container_name: postgres-sql
    image: postgres:16
    environment:
      POSTGRES_USER: redjanvier
      POSTGRES_PASSWORD: Jannyda1
      POSTGRES_DB: ist_signature
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin: